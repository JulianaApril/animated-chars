    [[1045.6,510.1],[1051.3,518.4],[1057.0,533.9],[1065.9,539.1]]
  ];
  var edge = [];
  shoulderSegs.forEach(function(s){
    for(var i=0;i<=16;i++){
      var u=i/16, v=1-u;
      edge.push([
        v*v*v*s[0][0]+3*v*v*u*s[1][0]+3*v*u*u*s[2][0]+u*u*u*s[3][0],
        v*v*v*s[0][1]+3*v*v*u*s[1][1]+3*v*u*u*s[2][1]+u*u*u*s[3][1]
      ]);
    }
  });

  function smooth(a){ a = a<0?0:(a>1?1:a); return a*a*(3-2*a); }

  function weight(x,y){
    var d = 1e9;
    for(var i=0;i<edge.length;i++){
      var dx=x-edge[i][0], dy=y-edge[i][1], q=dx*dx+dy*dy;
      if(q<d) d=q;
    }
    d = Math.sqrt(d);
    var wShoulder = smooth((d-10)/50);
    var hang = 0.4 + 0.6*smooth((y-110)/260);      
    var tip = smooth((x-1060)/50)*smooth((y-440)/40); 
    return wShoulder*hang*(1+0.7*tip);
  }

  function parse(d){
    var out=[], re=/([MCZ])([^MCZ]*)/g, m;
    while((m=re.exec(d))){
      var nums=(m[2].trim()?m[2].trim().split(/[\s,]+/).map(parseFloat):[]), pts=[];
      for(var i=0;i<nums.length;i+=2){
        pts.push({x:nums[i],y:nums[i+1],w:weight(nums[i],nums[i+1])});
      }
      out.push({c:m[1],pts:pts});
    }
    return out;
  }

  var models = targets.map(function(el){ return {el:el, cmds:parse(el.getAttribute('d'))}; });

  function offset(x,y,w,t){
    var s = t/1000;
    var ph = s*1.7 - y*0.012 + x*0.004;
    var gust = 0.7 + 0.3*Math.sin(s*0.55);
    var dx = w*(4.5 + 7.5*Math.sin(ph) + 3.5*Math.sin(s*2.9 - y*0.02 + 1.3))*gust;
    var dy = w*2.6*Math.sin(ph - 0.9);
    return [dx,dy];
  }

  function render(t){
    models.forEach(function(m){
      var parts = m.cmds.map(function(c){
        if(c.c==='Z') return 'Z';
        return c.c + c.pts.map(function(p){
          var o = offset(p.x,p.y,p.w,t);
          return (p.x+o[0]).toFixed(2)+' '+(p.y+o[1]).toFixed(2);
        }).join(' ');
      });
      m.el.setAttribute('d', parts.join(''));
    });
  }

  var fixed = new URLSearchParams(location.search).get('t');
  if(fixed!==null){ render(parseFloat(fixed)*1000); return; }
  if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  function loop(now){ render(now); requestAnimationFrame(loop); }
  requestAnimationFrame(loop);
})();
</script>
